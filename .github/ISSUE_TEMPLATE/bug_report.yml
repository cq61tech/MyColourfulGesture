name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Paste the report from Settings > Diagnostics > Copy report.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: report
    attributes:
      label: Report
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checked
      options:
        - label: LSPosed is 2.0.1 or newer
        - label: System UI, this app and my launcher are in the scope
        - label: I restarted System UI and the launcher after changing the scope
