name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        In the app, open Settings, then Diagnostics, tap **Copy report** and paste it below.
        Reports without it are very hard to act on, because every ROM and launcher behaves differently.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: textarea
    id: report
    attributes:
      label: Compatibility report
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checked
      options:
        - label: LSPosed is 2.0.1 or newer
        - label: System UI, this app and my launcher are ticked in the module scope
        - label: I restarted System UI and the launcher after changing the scope
