name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "No release key found, falling back to the public debug key"
          fi

      - name: Build universal release and debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease assembleDebug --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk MyColourfulGesture-build${{ github.run_number }}-universal.apk
          cp app/build/outputs/apk/debug/app-debug.apk MyColourfulGesture-build${{ github.run_number }}-debug.apk

      - name: Inspect APK
        continue-on-error: true
        run: |
          APK=MyColourfulGesture-build${{ github.run_number }}-universal.apk
          ls -lh MyColourfulGesture-build*.apk
          echo "ABIs:"
          unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u
          ZA=$(ls $ANDROID_HOME/build-tools/*/zipalign | sort -V | tail -1)
          "$ZA" -c -P 16 -v 4 "$APK" | tail -3
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs "$APK" | grep -E "SHA-256|Signer"

      - uses: actions/upload-artifact@v4
        with:
          name: MyColourfulGesture-build${{ github.run_number }}
          path: MyColourfulGesture-build${{ github.run_number }}-*.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: |
            MyColourfulGesture-build${{ github.run_number }}-universal.apk
            MyColourfulGesture-build${{ github.run_number }}-debug.apk
